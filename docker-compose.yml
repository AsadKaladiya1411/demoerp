services:
  backend:
    build: ./backend
    env_file: backend/.env
    ports:
      - "4000:4000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "3001:80"
    depends_on:
      - backend
